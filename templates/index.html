<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CLORX - Tutor AI Kelas 9</title>
    <style>
        body { font-family: sans-serif; max-width: 600px; margin: 20px auto; padding: 0 15px; background-color: #f4f7f6; }
        h1 { text-align: center; color: #2c3e50; }
        #chat-box { border: 1px solid #ddd; border-radius: 8px; padding: 15px; height: 400px; overflow-y: scroll; background: #fff; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .message { margin-bottom: 15px; padding: 10px; border-radius: 8px; max-width: 80%; line-height: 1.4; font-size: 15px; }
        .user { text-align: right; font-weight: bold; color: #fff; background: #007bff; margin-left: auto; border-bottom-right-radius: 0; }
        .ai { text-align: left; color: #333; background: #e9ecef; margin-right: auto; border-bottom-left-radius: 0; }
        .input-area { display: flex; margin-top: 15px; }
        #pertanyaan { flex-grow: 1; padding: 12px; border: 1px solid #ccc; border-radius: 4px; font-size: 16px; outline: none; }
        button { padding: 12px 24px; margin-left: 10px; background: #28a745; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; font-weight: bold; }
        button:hover { background: #218838; }
    </style>
</head>
<body>
    <h1>🤖 CLORX - Tutor AI Kelas 9</h1>
    <div id="chat-box"></div>
    <div class="input-area">
        <input type="text" id="pertanyaan" placeholder="Tanya apa saja ke CLORX..." autocomplete="off">
        <button onclick="kirimPertanyaan()">Kirim</button>
    </div>

    <script>
        async function kirimPertanyaan() {
            const input = document.getElementById('pertanyaan');
            const pertanyaan = input.value.trim();
            if (!pertanyaan) return;

            const chatBox = document.getElementById('chat-box');
            chatBox.innerHTML += `<div class="message user">Kamu: ${pertanyaan}</div>`;
            input.value = '';
            chatBox.scrollTop = chatBox.scrollHeight;

            try {
                const response = await fetch('/tanya', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ pertanyaan: pertanyaan })
                });
                const data = await response.json();
                
                if (data.jawaban) {
                    chatBox.innerHTML += `<div class="message ai">CLORX: ${data.jawaban}</div>`;
                } else {
                    chatBox.innerHTML += `<div class="message ai">CLORX: Maaf, terjadi error: ${data.error}</div>`;
                }
            } catch (error) {
                chatBox.innerHTML += `<div class="message ai">CLORX: Maaf, gagal terhubung ke server.</div>`;
            }
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        document.getElementById('pertanyaan').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') kirimPertanyaan();
        });
    </script>
</body>
      </html>
